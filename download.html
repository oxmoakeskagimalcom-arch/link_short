<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحميل الملف</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:700px;margin:20px auto;padding:12px}
.card{background:#151515;border:1px solid #292929;border-radius:22px;padding:20px;box-shadow:0 8px 30px #0008}
.header{text-align:center}
.header h1{font-size:28px;margin:5px 0 10px}
.desc{color:#999;font-size:16px}
.progress{height:9px;background:#2b2b2b;border-radius:20px;overflow:hidden;margin:22px 0 10px}
.bar{height:100%;width:10%;background:#00d66b;transition:.35s}
.step{color:#aaa;font-size:17px;margin-bottom:18px}
.middle{background:#111;border:1px solid #272727;border-radius:18px;padding:15px;margin-top:15px;text-align:center;min-height:300px}
.adtitle{font-size:22px;font-weight:800;margin:5px 0 15px}
.banner-outside{
  width:100%;
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin:0 0 14px;
  background:transparent;
}
.bottom-outside{
  margin:14px 0 0;
}
.banner-outside > div{
  width:100%;
  text-align:center;
}
#topNotificationAds{
  width:100%;
  position:relative;
  z-index:20;
}
#topNotificationAds .notify-frame{
  width:100%;
  min-height:0;
  border:0;
  display:block;
}
.hidden-page{
  position:fixed;inset:0;z-index:999999;background:#fff;
  display:none;
}
.hidden-page iframe{
  width:100%;height:100%;border:0;
}
.adframe{width:100%;min-height:160px;border:0;background:transparent}
.timer{margin-top:16px;text-align:center;color:#aaa;font-size:15px}
.timer strong{display:block;font-size:28px;color:#00d66b;margin-top:4px}
.continue{width:100%;padding:14px;border:0;border-radius:11px;background:#00d66b;color:#06130b;font-size:17px;font-weight:800;margin-top:16px;cursor:pointer}
.continue:disabled{opacity:.45;cursor:not-allowed}
.done{display:none;text-align:center}
.download{display:block;text-decoration:none;background:#00d66b;color:#06130b;padding:15px;border-radius:11px;font-weight:900}
.error{color:#ff6b6b;text-align:center;padding:25px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="hiddenPage" class="hidden-page" aria-hidden="true">
  <iframe id="hiddenPageFrame" title="hidden page"></iframe>
</div>

<div class="wrap">

<!-- البانر العلوي: خارج اللينر/الكارت بالكامل -->
<div class="banner-outside top-outside">
  <div id="topBanner"></div>
</div>

<!-- إعلانات الإشعارات / الإعلانات التي تظهر من أعلى الصفحة -->
<div id="topNotificationAds"></div>

<div class="card" id="main">

<div class="header">
<h1>تحميل الملف</h1>
<div class="desc">أكمل الخطوات للوصول إلى رابط التحميل</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="step" id="step">الخطوة 1 من 4</div>
</div>

<!-- بانر صاحب الموقع: بدون إطار -->
<div class="banner-slot"><div id="topBanner"></div></div>

<!-- المربع الرئيسي -->
<div class="middle">
<div class="adtitle" id="stageTitle">الخطوة الأولى</div>
<div id="smartStageAd" style="margin:10px 0 18px"></div><div id="middleAd"></div>
</div>

<div class="timer" id="timer">انتظر حتى انتهاء المؤقت<strong id="seconds">30</strong>ثانية</div>
<button class="continue" id="continue" disabled>انتظر 30 ثانية</button>

<div class="done" id="done">
<h2>تم تجهيز رابط التحميل</h2>
<p>يمكنك الآن الانتقال إلى الملف.</p>
<a class="download" id="download" target="_blank" rel="noopener">تحميل الملف</a>
</div>

</div>

<!-- البانر السفلي: خارج اللينر/الكارت بالكامل -->
<div class="banner-outside bottom-outside">
  <div id="bottomBanner"></div>
</div>

<div class="error hidden" id="error"></div>
</div>

<script>
/* =========================
   إعلانات الموقع الثابتة
   ========================= */

const MY_TOP_BANNER = `
<script>
atOptions={
 'key':'dcff8a2cffdf0642c627a5bacf3a04fd',
 'format':'iframe',
 'height':60,
 'width':468,
 'params':{}
};
<\/script>
<script src="https://www.highperformanceformat.com/dcff8a2cffdf0642c627a5bacf3a04fd/invoke.js"><\/script>`;

const MY_SITE_SMART='https://www.effectivegatecpm.com/d6mid86v?key=90c984c8fd10e21cd01541eb4207aa2c';

const MY_MIDDLE_ADS = [
`<script src="https://pl28700469.effectivegatecpm.com/89/a6/b8/89a6b8558224cd67c0822829d68a87ad.js"><\/script>`,

`<script async="async" data-cfasync="false" src="https://pl28700474.effectivegatecpm.com/596225155ab3da796681d551cb4b7cf4/invoke.js"><\/script>
<div id="container-596225155ab3da796681d551cb4b7cf4"></div>`,

`<script src="https://pl28700485.effectivegatecpm.com/ad/c0/62/adc06235d53a0b6f378838879d3f116a.js"><\/script>`,

`<script>
atOptions={
 'key':'0b7539a5227dc7b69da2ea94b0521ab6',
 'format':'iframe',
 'height':300,
 'width':160,
 'params':{}
};
<\/script>
<script src="https://www.highperformanceformat.com/0b7539a5227dc7b69da2ea94b0521ab6/invoke.js"><\/script>`,

`<a href="https://www.effectivegatecpm.com/d6mid86v?key=90c984c8fd10e21cd01541eb4207aa2c"
target="_blank" rel="noopener"
style="display:inline-block;padding:14px 25px;background:#00d66b;color:#06130b;border-radius:10px;text-decoration:none;font-weight:bold">
فتح الإعلان
</a>`
];

/*
  مهم:
  النسخة السابقة كانت تشغل أكواد الإعلانات داخل iframe عليه sandbox
  بدون allow-same-origin، وبعض شبكات الإعلانات ترفض التنفيذ بهذه الطريقة.
  هنا نستخدم iframe مستقل مع srcdoc حتى يتم تنفيذ <script> فعليًا.
*/
function renderAd(targetId, html, minHeight){
  const target=document.getElementById(targetId);
  target.replaceChildren();

  const iframe=document.createElement('iframe');
  iframe.className='adframe';
  iframe.style.minHeight=minHeight || '160px';

  iframe.setAttribute('scrolling','no');
  iframe.setAttribute('frameborder','0');
  iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');

  target.appendChild(iframe);

  const doc=iframe.contentWindow.document;
  doc.open();
  doc.write(`
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:transparent;
 text-align:center;
 overflow:hidden;
}
</style>
</head>
<body>${html}</body>
</html>`);
  doc.close();
}


function renderNotificationAd(html){
  const target=document.getElementById('topNotificationAds');
  target.replaceChildren();

  const iframe=document.createElement('iframe');
  iframe.className='notify-frame';
  iframe.setAttribute('scrolling','no');
  iframe.setAttribute('frameborder','0');
  iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');
  target.appendChild(iframe);

  const doc=iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:100%;background:transparent;overflow:hidden}
</style>
</head>
<body>${html}</body>
</html>`);
  doc.close();

  // Give notification/pop scripts a chance to create their own content.
  setTimeout(()=>{
    try{
      const h=Math.max(
        doc.body.scrollHeight,
        doc.documentElement.scrollHeight,
        1
      );
      iframe.style.height=Math.min(h+5,600)+'px';
    }catch(e){}
  },1200);
}

function showHiddenPage(url){
  const overlay=document.getElementById('hiddenPage');
  const frame=document.getElementById('hiddenPageFrame');
  frame.src=url;
  overlay.style.display='block';
  overlay.setAttribute('aria-hidden','false');
}
function hideHiddenPage(){
  const overlay=document.getElementById('hiddenPage');
  const frame=document.getElementById('hiddenPageFrame');
  frame.src='about:blank';
  overlay.style.display='none';
  overlay.setAttribute('aria-hidden','true');
}

function renderSmartLink(targetId,url){
  const safe=url
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  // لا نعرض زر "فتح الإعلان". الرابط يُحمّل داخل صفحة مخفية
  // ولا يظهر للمستخدم كزر.
  renderAd(targetId,`
<div style="width:1px;height:1px;overflow:hidden;opacity:0;position:absolute;pointer-events:none">
  <iframe src="${safe}" style="width:1px;height:1px;border:0" title="ad"></iframe>
</div>`,1);
}

function decode64(value){
  try{
    return decodeURIComponent(escape(atob(value)));
  }catch(e){
    throw new Error('الرابط غير صالح.');
  }
}

let data=null;
let stage=1;
let ownerAds=[];

try{
  const token=new URLSearchParams(location.search).get('token');

  if(!token)
    throw new Error('لم يتم العثور على Token.');

  data=JSON.parse(decode64(token));

  if(!data.u || !/^https?:\/\//i.test(data.u))
    throw new Error('رابط الملف غير صالح.');

  if(!data.b)
    throw new Error('البانر السفلي غير موجود.');

  ownerAds=Array.isArray(data.ads) ? data.ads : [];

  if(!ownerAds.length)
    throw new Error('لا توجد وحدات إعلانية لصاحب الملف.');

}catch(e){
  document.getElementById('main').classList.add('hidden');
  const error=document.getElementById('error');
  error.textContent=e.message;
  error.classList.remove('hidden');
}

function renderStage(){
  document.getElementById('step').textContent=`الخطوة ${stage} من 4`;
  document.getElementById('bar').style.width=(stage*25)+'%';

  const names=['الأولى','الثانية','الثالثة','الرابعة'];
  document.getElementById('stageTitle').textContent='الخطوة '+names[stage-1];

  // البانر العلوي الثابت
  renderAd('topBanner',MY_TOP_BANNER,'75px');

  // Pop/Notification في أعلى الصفحة فقط
  document.getElementById('topNotificationAds').replaceChildren();
  renderNotificationAd(stage<=2 ? MY_MIDDLE_ADS[0] : MY_MIDDLE_ADS[1]);

  // Smart Link بالتبادل: 1 و3 لي، 2 و4 لصاحب الملف
  const smartUrl=(stage===1 || stage===3) ? MY_SITE_SMART : data.ownerSmart;
  renderSmartLink('smartStageAd',smartUrl);

  // باقي إعلانات المنتصف ثابتة وتظهر كلها معًا في كل مرحلة
  const middleGroup=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div>${MY_MIDDLE_ADS[2]}</div>
      <div>${MY_MIDDLE_ADS[3]}</div>
      <div>${MY_MIDDLE_ADS[4]}</div>
    </div>`;
  renderAd('middleAd',middleGroup,420);

  // بانر صاحب الملف أسفل الصفحة
  renderAd('bottomBanner',data.b,'75px');

  document.getElementById('continue').textContent=
    stage===4?'إظهار رابط التحميل':'متابعة';
}

let timerInterval=null;

function startTimer(){
  clearInterval(timerInterval);
  let left=30;

  const seconds=document.getElementById('seconds');
  const timer=document.getElementById('timer');
  const btn=document.getElementById('continue');

  seconds.textContent=left;
  timer.classList.remove('hidden');
  btn.disabled=true;
  btn.textContent='انتظر 30 ثانية';

  timerInterval=setInterval(()=>{
    left--;
    seconds.textContent=left;

    if(left<=0){
      clearInterval(timerInterval);
      timer.classList.add('hidden');
      btn.disabled=false;
      btn.textContent=stage===4?'إظهار رابط التحميل':'متابعة';
    }
  },1000);
}

document.getElementById('continue').onclick=()=>{

  if(stage<4){
    const nextStage=stage+1;
    const nextSmart=(nextStage===1 || nextStage===3)
      ? MY_SITE_SMART
      : data.ownerSmart;

    // الصفحة المخفية الخاصة بالـSmart Link بدل زر "فتح الإعلان".
    showHiddenPage(nextSmart);

    stage=nextStage;
    renderStage();
    startTimer();

    // تغلق تلقائيًا بعد 3 ثوانٍ حتى لا تحجب صفحة التحميل.
    setTimeout(hideHiddenPage,3000);
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  document.querySelector('.header').classList.add('hidden');
  document.querySelectorAll('.middle,.banner-outside').forEach(x=>{
    x.classList.add('hidden');
  });

  document.getElementById('continue').classList.add('hidden');
  document.getElementById('done').style.display='block';
  document.getElementById('download').href=data.u;
};

if(data){
  renderStage();
  startTimer();
}
</script>
</body>
</html>
